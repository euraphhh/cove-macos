name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Build app
        run: ./scripts/bundle.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent Cove.app Cove.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: build/Cove.zip
          generate_release_notes: true

      - name: Update Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: |
          git fetch origin gh-pages
          git worktree add pages origin/gh-pages
          ./scripts/appcast-item.sh "$VERSION" build/Cove.zip pages/appcast.xml
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Appcast: v$VERSION"
          git push origin HEAD:gh-pages

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        if: env.TAP_TOKEN != ''
        run: |
          SHA=$(shasum -a 256 build/Cove.zip | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/euraphhh/homebrew-tap.git" tap
          cd tap
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/cove.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "cove $VERSION"
          git push
