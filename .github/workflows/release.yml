name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/bundle.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent Cove.app Cove.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: build/Cove.zip
          generate_release_notes: true
